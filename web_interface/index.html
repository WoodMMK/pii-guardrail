<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thai Local OCR (PaddleOCR)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Thai Local OCR (PaddleOCR Engine POC)</h1>
      <p class="intro">
        Upload a PNG or JPEG image to extract Thai &amp; English text locally.
        Runs 100% offline and private without cloud API keys.
      </p>

      <form id="upload-form" class="upload-form">
        <label for="file-input" class="file-label">Select an image</label>
        <input
          id="file-input"
          name="image"
          type="file"
          accept="image/png,image/jpeg"
          required
        />
        <button id="submit-btn" type="submit">Run OCR</button>
      </form>

      <!-- Processing status indicator (Requirement 9.5). Hidden until a
           request is in flight; shown via app.js while awaiting the response. -->
      <div
        id="status-indicator"
        class="status-indicator"
        role="status"
        aria-live="polite"
        aria-busy="false"
        hidden
      >
        <span class="spinner" aria-hidden="true"></span>
        <span class="status-text">Processing...</span>
      </div>

      <!-- Populated by task 16.2 (results rendering + download control). -->
      <div id="result-container" class="result-container"></div>

      <!-- Populated by task 16.2 (error message / warnings rendering). -->
      <div id="error-container" class="error-container" role="alert"></div>

    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
